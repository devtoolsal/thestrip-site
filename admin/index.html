<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>TheStrip — Operations Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;650;700;750&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --amber:#9E5538; --ink:#232320; --charcoal:#1B1A17; --cream:#F4F3EF;
    --sand:#CECDC6; --walnut:#9E5538; --success:#3E7A55; --busy:#4A6FA5;
    --fault:#B5452F; --line:rgba(206,205,198,.18); --muted:#A8A59D;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#1B1A17;color:var(--cream);font-family:'DM Sans',system-ui,sans-serif;font-size:14px}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--amber)}
  .hidden{display:none!important}
  .muted{color:var(--muted)}
  .tiny{font-size:11.5px;color:var(--muted)}
  .eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--walnut);font-weight:700}
  .mark{font-family:'DM Sans',system-ui,sans-serif;font-weight:750;font-size:30px;letter-spacing:-.04em}
  .dot{color:var(--amber)}
  h1,h2,h3{margin:0}
  h1{font-family:'DM Sans',system-ui,sans-serif;font-size:30px;font-weight:750;letter-spacing:-.03em}
  h2{font-size:16px}
  h3{font-size:13.5px;color:var(--sand);margin-bottom:10px}

  /* Login */
  .login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 20% 0%,#2A2824 0%,#1B1A17 55%)}
  .login-card{width:100%;max-width:420px;background:var(--ink);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
  .login-card h1{font-size:32px;margin:16px 0 6px}
  .login-card p{margin:0 0 20px;line-height:1.5}
  .error{background:rgba(214,75,58,.12);border:1px solid rgba(214,75,58,.45);color:#ffb4a8;border-radius:12px;padding:10px 12px;margin:12px 0;font-size:12.5px}

  /* Layout */
  .layout{min-height:100vh}
  .sidebar{position:fixed;inset:0 auto 0 0;width:224px;background:var(--ink);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:22px}
  .brand .sub{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:4px}
  nav{display:flex;flex-direction:column;gap:4px}
  nav button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:10px;color:var(--sand);font-weight:600;font-size:13.5px}
  nav button:hover{background:rgba(217,198,168,.07);color:var(--cream)}
  nav button.active{background:var(--amber);color:var(--cream)}
  .sidebar-foot{margin-top:auto;font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
  .dot-live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--success);margin-right:6px}
  .link{background:none;border:0;color:var(--sand);padding:0;text-align:left;font-size:11.5px;text-decoration:underline}
  main{margin-left:224px;padding:26px 28px 60px;min-height:100vh}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}
  .top-actions{display:flex;align-items:center;gap:12px}

  /* Building blocks */
  .panel{background:var(--ink);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
  .panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
  .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
  .card{background:var(--ink);border:1px solid var(--line);border-radius:18px;padding:18px}
  .card .label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .card .value{font-family:'DM Sans',system-ui,sans-serif;font-size:34px;font-weight:750;letter-spacing:-.03em;margin-top:8px}
  .card .sub{font-size:12px;color:var(--sand);margin-top:4px}
  .grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}
  .map{height:300px;border-radius:12px;overflow:hidden;background:#141310}
  .empty{padding:18px;color:var(--muted);text-align:center}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--amber);color:var(--cream);border:0;border-radius:999px;padding:11px 18px;font-weight:700;font-size:13px}
  .btn:hover{filter:brightness(1.05)}
  .btn.small{padding:7px 12px;font-size:12px}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--sand);font-weight:600}
  .btn.ghost:hover{border-color:var(--sand);color:var(--cream)}
  .btn.danger{background:none;border:1px solid rgba(214,75,58,.5);color:#ffb4a8}
  .btn:disabled{opacity:.45;cursor:default}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .field span{font-size:11.5px;color:var(--sand);font-weight:600}
  input,select,textarea{background:#120f0d;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--amber)}
  textarea{resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .form{max-width:520px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .toolbar select,.toolbar input{width:auto;min-width:150px}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sand);margin:6px 0 14px}
  .check input{width:auto}

  table{width:100%;border-collapse:collapse}
  th{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:10px;border-bottom:1px solid rgba(217,198,168,.08);vertical-align:top;font-size:12.5px}
  tr.row{cursor:pointer}
  tr.row:hover td{background:rgba(242,160,61,.05)}
  .badge{display:inline-block;border-radius:999px;padding:3px 8px;font-size:10.5px;font-weight:700;letter-spacing:.04em}
  .badge.ok{background:rgba(46,158,91,.16);color:#7fe0a4;border:1px solid rgba(46,158,91,.35)}
  .badge.off{background:rgba(141,133,121,.14);color:var(--muted);border:1px solid rgba(141,133,121,.3)}
  .badge.warn{background:rgba(242,160,61,.14);color:#ffcf8a;border:1px solid rgba(242,160,61,.35)}
  .badge.err{background:rgba(214,75,58,.14);color:#ffb4a8;border:1px solid rgba(214,75,58,.35)}
  .badge.info{background:rgba(61,125,216,.14);color:#a9c8ff;border:1px solid rgba(61,125,216,.35)}
  .chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:10.5px;color:var(--sand);margin:0 4px 4px 0}
  .chip.ok{border-color:rgba(46,158,91,.35);color:#7fe0a4}
  .chip.err{border-color:rgba(214,75,58,.35);color:#ffb4a8}
  .chip.warn{border-color:rgba(242,160,61,.35);color:#ffcf8a}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto;z-index:50}
  .modal-card{width:100%;max-width:980px;background:var(--charcoal);border:1px solid var(--line);border-radius:22px;padding:22px;margin:auto}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
  .kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
  .kv .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .kv .v{font-size:13px;margin-top:4px;color:var(--cream);word-break:break-word}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);border:1px solid var(--line);color:var(--cream);padding:11px 18px;border-radius:999px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:80}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast.err{border-color:rgba(214,75,58,.5);color:#ffb4a8}
  .loading{padding:40px;text-align:center;color:var(--muted)}

  @media (max-width:1000px){
    .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid2{grid-template-columns:1fr}
  }
  @media (max-width:820px){
    .sidebar{position:static;width:auto;height:auto;flex-direction:row;align-items:center;overflow-x:auto;gap:12px;padding:12px}
    .brand .sub,.sidebar-foot{display:none}
    nav{flex-direction:row}
    nav button{white-space:nowrap}
    main{margin-left:0;padding:18px}
    .kv{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>

<div id="login" class="login">
  <form id="loginForm" class="login-card">
    <div class="mark">The Strip</div>
    <div class="eyebrow" style="margin-top:20px">Operations console</div>
    <h1>Fleet control</h1>
    <p class="muted">Sites, devices, remote commands, OTA releases and revenue in one place.</p>
    <label class="field"><span>Admin token</span><input id="token" type="password" placeholder="Bearer token" autocomplete="current-password"></label>
    <div id="loginError" class="error hidden"></div>
    <button class="btn" type="submit" style="width:100%">Open console</button>
    <div class="tiny" style="text-align:center;margin-top:14px">Staging · use the API ADMIN_TOKEN</div>
  </form>
</div>

<div id="app" class="layout hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">The Strip</div>
      <div class="sub">ops console</div>
    </div>
    <nav id="nav">
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="fleet">Fleet</button>
      <button data-view="sites">Sites</button>
      <button data-view="enquiries">Enquiries</button>
      <button data-view="ota">OTA</button>
      <button data-view="orders">Orders</button>
      <button data-view="plans">Price plans</button>
      <button data-view="audit">Audit</button>
    </nav>
    <div class="sidebar-foot">
      <div><span class="dot-live"></span>API connected</div>
      <button id="logout" class="link">Sign out</button>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <div>
        <div class="eyebrow" id="viewEyebrow">Operations</div>
        <h1 id="viewTitle">Dashboard</h1>
      </div>
      <div class="top-actions">
        <span id="updated" class="tiny"></span>
        <button id="refresh" class="btn ghost small">Refresh</button>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
<div id="toast" class="toast"></div>

<script src="../js/config.js"></script>
<script>
const S = {
  token: sessionStorage.getItem("thestrip.adminToken") || "",
  view: "dashboard",
  summary: null,
  fleet: null,
  sites: [],
  releases: [],
  orders: [],
  plans: [],
  audit: [],
  enquiries: [],
  map: null,
  editingSite: null,
  editingPlan: null,
  loading: false,
  timer: null
};

const $ = (id) => document.getElementById(id);
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (cents) => "R" + (Number(cents || 0) / 100).toFixed(2);
const dt = (iso) => iso ? new Date(iso).toLocaleString("en-ZA", { dateStyle: "medium", timeStyle: "short" }) : "—";
const ago = (iso) => {
  if (!iso) return "never";
  const seconds = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (seconds < 60) return seconds + "s ago";
  if (seconds < 3600) return Math.floor(seconds / 60) + "m ago";
  if (seconds < 86400) return Math.floor(seconds / 3600) + "h ago";
  return Math.floor(seconds / 86400) + "d ago";
};
const statusBadge = (status) => {
  const value = String(status || "").toLowerCase();
  const kind = ["done", "paid", "active", "published", "online", "booked"].includes(value)
    ? "ok"
    : ["failed", "error", "revoked", "refunded", "offline"].includes(value)
      ? "err"
      : ["closed", "cancelled", "expired"].includes(value)
        ? "off"
        : ["pending", "delivered", "awaiting_payment", "draft", "new"].includes(value)
        ? "warn"
        : "info";
  return `<span class="badge ${kind}">${esc(status || "—")}</span>`;
};

const API_BASE = (window.THESTRIP_API_BASE || "/v1").replace(/\/$/, "");

async function api(path, options = {}) {
  const headers = { ...(options.headers || {}), Authorization: "Bearer " + S.token };
  let body = options.body;
  if (options.json !== undefined) {
    headers["Content-Type"] = "application/json";
    body = JSON.stringify(options.json);
  }
  const response = await fetch(API_BASE + path, { method: options.method || "GET", headers, body });
  const text = await response.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!response.ok) throw new Error((data && data.message) || response.statusText);
  return data;
}

function toast(message, kind = "ok") {
  const element = $("toast");
  element.textContent = message;
  element.className = "toast on" + (kind === "err" ? " err" : "");
  clearTimeout(window._toast);
  window._toast = setTimeout(() => { element.className = "toast"; }, 2200);
}

function card(label, value, sub) {
  return `<div class="card"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="sub">${esc(sub)}</div></div>`;
}

function healthChips(health) {
  if (!health || !Object.keys(health).length) return '<span class="muted">No health yet</span>';
  return Object.entries(health).map(([key, value]) => {
    let kind = "";
    if (value === "ready" || value === "wifi" || value === "ethernet") kind = "ok";
    else if (value === "missing" || value === "offline" || value === "not_granted") kind = "err";
    else if (key === "storageFreeMb" && Number(value) < 500) kind = "warn";
    return `<span class="chip ${kind}">${esc(key)}: ${esc(value)}</span>`;
  }).join("");
}

function deviceTable(devices) {
  if (!devices.length) return '<div class="empty">No devices.</div>';
  return `<table><thead><tr><th>Device</th><th>Site</th><th>State</th><th>Version</th><th>Health</th><th>Last seen</th></tr></thead><tbody>
    ${devices.map((device) => `
      <tr class="row" data-device="${esc(device.id)}">
        <td><strong>${esc(device.serial)}</strong><div class="tiny">${esc(device.model || "")}</div></td>
        <td>${device.site ? esc(device.site.code) : '<span class="muted">unassigned</span>'}</td>
        <td>${device.online ? '<span class="badge ok">online</span>' : '<span class="badge off">offline</span>'} <span class="badge info">${esc(device.appState || "—")}</span></td>
        <td>${esc(device.appVersion || "—")}<div class="tiny">Android ${esc(device.androidVersion || "?")}</div></td>
        <td>${healthChips(device.health)}</td>
        <td>${ago(device.lastSeenAt)}</td>
      </tr>`).join("")}
  </tbody></table>`;
}

function bindDeviceRows() {
  document.querySelectorAll("[data-device]").forEach((row) => {
    row.onclick = () => openDevice(row.dataset.device);
  });
}

function renderLogin(message) {
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
  if (message) {
    $("loginError").textContent = message;
    $("loginError").classList.remove("hidden");
  }
}

function showApp() {
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
}

async function boot() {
  showApp();
  document.querySelectorAll("#nav button").forEach((button) => {
    button.onclick = () => navigate(button.dataset.view);
  });
  $("refresh").onclick = () => refresh();
  $("logout").onclick = () => {
    sessionStorage.removeItem("thestrip.adminToken");
    location.reload();
  };
  await navigate(S.view || "dashboard");
  if (!S.timer) {
    S.timer = setInterval(() => {
      if (!$("modal").classList.contains("hidden")) return;
      if (S.view === "dashboard" || S.view === "fleet") refresh();
    }, 30000);
  }
}

async function loadView(view) {
  if (view === "dashboard") {
    const [summary, fleet, sites] = await Promise.all([
      api("/admin/summary"), api("/admin/fleet"), api("/admin/sites")
    ]);
    S.summary = summary; S.fleet = fleet; S.sites = sites;
    renderDashboard();
  } else if (view === "fleet") {
    const [fleet, sites] = await Promise.all([api("/admin/fleet"), api("/admin/sites")]);
    S.fleet = fleet; S.sites = sites;
    renderFleet();
  } else if (view === "sites") {
    S.sites = await api("/admin/sites");
    renderSites();
  } else if (view === "enquiries") {
    S.enquiries = await api("/admin/enquiries");
    renderEnquiries();
  } else if (view === "ota") {
    const [releases, sites] = await Promise.all([api("/admin/ota/releases"), api("/admin/sites")]);
    S.releases = releases; S.sites = sites;
    renderOta();
  } else if (view === "orders") {
    const [orders, sites] = await Promise.all([api("/admin/orders?limit=100"), api("/admin/sites")]);
    S.orders = orders; S.sites = sites;
    renderOrders();
  } else if (view === "plans") {
    const [plans, sites] = await Promise.all([api("/admin/price-plans"), api("/admin/sites")]);
    S.plans = plans; S.sites = sites;
    renderPlans();
  } else if (view === "audit") {
    S.audit = await api("/admin/audit?limit=150");
    renderAudit();
  }
  $("updated").textContent = "Updated " + new Date().toLocaleTimeString("en-ZA", { hour: "2-digit", minute: "2-digit" });
}

async function navigate(view) {
  S.view = view;
  document.querySelectorAll("#nav button").forEach((button) => {
    button.classList.toggle("active", button.dataset.view === view);
  });
  const titles = {
    dashboard: "Dashboard", fleet: "Fleet", sites: "Sites", ota: "OTA releases",
    orders: "Orders", plans: "Price plans", audit: "Audit", enquiries: "Enquiries"
  };
  $("viewTitle").textContent = titles[view] || "Dashboard";
  $("viewEyebrow").textContent = view === "dashboard" ? "Operations" : "Fleet management";
  $("view").innerHTML = '<div class="loading">Loading…</div>';
  try { await loadView(view); }
  catch (error) { $("view").innerHTML = `<div class="error">${esc(error.message)}</div>`; }
}

async function refresh() {
  if (S.loading) return;
  S.loading = true;
  try { await loadView(S.view); }
  catch (error) { toast(error.message, "err"); }
  finally { S.loading = false; }
}

function renderDashboard() {
  const summary = S.summary;
  const fleet = S.fleet;
  const alerts = fleet.alerts || [];

  $("view").innerHTML = `
    <div class="cards">
      ${card("Devices", summary.devices, `${summary.online} online · ${summary.offline} offline`)}
      ${card("Sites", summary.sites, "locations")}
      ${card("Revenue", money(summary.revenueCents), `${summary.paidOrders} paid orders`)}
      ${card("New enquiries", summary.newEnquiries ?? 0, `${summary.enquiries ?? 0} total`)}
    </div>
    <div class="grid2">
      <div class="panel"><div class="panel-head"><h2>Fleet map</h2><span class="tiny">${fleet.sites.length} sites</span></div><div id="map" class="map"></div></div>
      <div class="panel"><div class="panel-head"><h2>Alerts</h2><span class="tiny">${alerts.length}</span></div>
        ${alerts.length ? alerts.slice(0, 12).map((alert) => `
          <div style="padding:8px 0;border-bottom:1px solid rgba(217,198,168,.08)">
            <span class="badge ${alert.severity === "error" ? "err" : alert.severity === "warn" ? "warn" : "info"}">${esc(alert.type)}</span>
            <span style="margin-left:6px">${esc(alert.serial)}</span>
            <div class="tiny">${esc(alert.detail || "")}</div>
          </div>`).join("") : '<div class="empty">No alerts.</div>'}
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Recent devices</h2><button class="btn ghost small" id="goFleet">View all</button></div>
      ${deviceTable((fleet.devices || []).slice(0, 10))}
    </div>
  `;

  bindDeviceRows();
  $("goFleet").onclick = () => navigate("fleet");
  initMap(fleet.sites || []);
}

function initMap(sites) {
  const container = $("map");
  if (!container) return;
  if (!window.L) {
    container.innerHTML = '<div class="empty">Map library unavailable.</div>';
    return;
  }
  if (S.map) { S.map.remove(); S.map = null; }

  const located = sites.filter((site) => site.lat != null && site.lng != null);
  if (!located.length) {
    container.innerHTML = '<div class="empty">Add coordinates to sites to see the map.</div>';
    return;
  }

  const map = L.map(container).setView([-26.2, 28.0], 5);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "© OpenStreetMap"
  }).addTo(map);

  located.forEach((site) => {
    const devices = (S.fleet?.devices || []).filter((device) => device.site && device.site.id === site.id);
    L.circleMarker([site.lat, site.lng], {
      radius: 9, color: "#F2A03D", weight: 2, fillColor: "#F2A03D", fillOpacity: 0.75
    }).addTo(map).bindPopup(

function renderFleet() {
  const sites = S.sites;
  $("view").innerHTML = `
    <div class="panel">
      <div class="toolbar">
        <select id="fSite"><option value="">All sites</option>${sites.map((site) => `<option value="${esc(site.id)}">${esc(site.code)} — ${esc(site.name)}</option>`).join("")}</select>

        <input id="fSearch" placeholder="Search serial…">
        <span id="fCount" class="tiny"></span>
      </div>
      <div id="fTable"></div>
    </div>
  `;

  const draw = () => {
    const siteId = $("fSite").value;
    const online = $("fOnline").value;
    const query = $("fSearch").value.trim().toLowerCase();
    const rows = (S.fleet.devices || []).filter((device) => {
      if (siteId && (!device.site || device.site.id !== siteId)) return false;
      if (online === "online" && !device.online) return false;
      if (online === "offline" && device.online) return false;
      if (query && !device.serial.toLowerCase().includes(query)) return false;
      return true;
    });
    $("fCount").textContent = rows.length + " device(s)";
    $("fTable").innerHTML = deviceTable(rows);
    bindDeviceRows();
  };

  $("fSite").onchange = draw;
  $("fOnline").onchange = draw;
  $("fSearch").oninput = draw;
  draw();
}

      api("/admin/ota/releases")

    S.releases = releases;
    const published = releases.filter((release) => release.status === "published");
    const siteOptions = S.sites.map((site) =>
      `<option value="${esc(site.id)}" ${device.siteId === site.id ? "selected" : ""}>${esc(site.code)} — ${esc(site.name)}</option>`
    ).join("");

    $("modalCard").innerHTML = `

        <div><div class="eyebrow">Device</div><h2>${esc(device.serial)}</h2><div class="tiny">${esc(device.model || "")}</div></div>

    };
    document.querySelectorAll("[data-cmd]").forEach((button) => {
      button.onclick = async () => {
        try {
          await api("/admin/devices/" + device.id + "/commands", {
            method: "POST",
            json: { type: button.dataset.cmd }
          });
          toast(button.dataset.cmd + " queued");
          await openDevice(device.id);
        } catch (error) { toast(error.message, "err"); }
      };
    });
  } catch (error) {
    toast(error.message, "err");
  }
}

function closeModal() {
  $("modal").classList.add("hidden");
}

$("modal").onclick = (event) => { if (event.target === $("modal")) closeModal(); };
document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeModal(); });

$("loginForm").onsubmit = async (event) => {
  event.preventDefault();
  const token = $("token").value.trim();
  if (!token) return;
  S.token = token;
  try {
    await api("/admin/summary");
    sessionStorage.setItem("thestrip.adminToken", token);
    $("loginError").classList.add("hidden");
    await boot();
  } catch (error) {
    S.token = "";
    $("loginError").textContent = error.message;
    $("loginError").classList.remove("hidden");
  }
};

(async function start() {
  if (!S.token) { renderLogin(); return; }
  try { await boot(); }
  catch {
    sessionStorage.removeItem("thestrip.adminToken");
    S.token = "";
    renderLogin("Session expired — enter the admin token again.");
  }
})();
</script>
</body>
</html>
